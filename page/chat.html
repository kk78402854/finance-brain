<!-- 金融知识库查询页面：DeepSeek 式布局（可收起侧栏 / 历史会话 / 日期分组 / 欢迎屏 / 大气输入框） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融智库 · 智能问答</title>
<style>
:root {
    --sb-w: 264px;
    --sb-bg: #0c1f1b;
    --sb-bg-2: #0a1a17;
    --sb-border: rgba(255,255,255,.07);
    --sb-text: #9db8b1;
    --sb-text-dim: #64807a;
    --accent: #0d9488;
    --accent-2: #14b8a6;
    --accent-soft: rgba(20,184,166,.16);
    --bg: #f6f8f7;
    --surface: #ffffff;
    --border: #e4eae8;
    --text-1: #10201d;
    --text-2: #4b5f5b;
    --text-3: #90a29d;
    --user-bubble: #d8f0eb;
    --user-text: #0b3a33;
    --danger: #dc2626;
    --radius: 12px;
    --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text-1);
    font-size: 14px;
    overflow: hidden;
}
button { font-family: inherit; cursor: pointer; }

.app { display: flex; height: 100vh; }

/* ================= 侧栏 ================= */
.sidebar {
    width: var(--sb-w);
    flex: none;
    background: var(--sb-bg);
    color: var(--sb-text);
    display: flex;
    flex-direction: column;
    transition: margin-left .25s ease;
    overflow: hidden;
}
body.collapsed .sidebar { margin-left: calc(-1 * var(--sb-w)); }

.sb-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 12px;
    flex: none;
}
.sb-logo { display: flex; align-items: center; gap: 10px; color: #fff; }
.sb-logo-mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(13,148,136,.35);
}
.sb-logo-mark svg { width: 18px; height: 18px; }
.sb-logo-name { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.sb-logo-sub { font-size: 10px; color: var(--sb-text-dim); margin-top: 1px; }

.icon-btn {
    background: none; border: none; color: var(--sb-text);
    width: 30px; height: 30px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.icon-btn svg { width: 16px; height: 16px; }

.new-chat {
    margin: 4px 12px 10px;
    padding: 10px 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 10px;
    font-size: 13.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: filter .15s, transform .1s;
}
.new-chat:hover { filter: brightness(1.1); }
.new-chat:active { transform: scale(.98); }
.new-chat svg { width: 15px; height: 15px; }

.sb-search { margin: 0 12px 8px; flex: none; }
.sb-search input {
    width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--sb-text);
    padding: 7px 10px 7px 30px;
    font-size: 12.5px;
    outline: none;
    transition: border-color .15s, background .15s;
}
.sb-search input:focus { border-color: var(--accent); background: rgba(255,255,255,.09); }
.sb-search input::placeholder { color: var(--sb-text-dim); }
.sb-search { position: relative; }
.sb-search svg {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--sb-text-dim); pointer-events: none;
}

.sb-scroll { flex: 1; overflow-y: auto; padding: 2px 8px 10px; }
.sb-scroll::-webkit-scrollbar { width: 5px; }
.sb-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

.sb-group-label {
    font-size: 11px; color: var(--sb-text-dim);
    padding: 12px 8px 5px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 6px;
}
.sb-group-label::after { content: ''; flex: 1; height: 1px; background: var(--sb-border); }

.session-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer; color: var(--sb-text);
    transition: background .12s;
    position: relative;
}
.session-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.session-item.active { background: var(--accent-soft); color: #fff; }
.session-item.active::before {
    content: ''; position: absolute; left: -4px; top: 20%; bottom: 20%;
    width: 3px; border-radius: 2px; background: var(--accent-2);
}
.session-title {
    flex: 1; font-size: 12.8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-del {
    flex: none; display: none;
    background: none; border: none; color: var(--sb-text-dim);
    width: 22px; height: 22px; border-radius: 5px;
    align-items: center; justify-content: center;
}
.session-item:hover .session-del { display: flex; }
.session-del:hover { color: #f87171; background: rgba(248,113,113,.12); }
.session-del svg { width: 13px; height: 13px; }

.sb-empty { text-align: center; color: var(--sb-text-dim); font-size: 12px; padding: 26px 10px; }

.sb-footer {
    flex: none; border-top: 1px solid var(--sb-border);
    padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 8px;
}
.sb-link {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px;
    color: var(--sb-text); text-decoration: none; font-size: 13px;
    transition: background .12s, color .12s;
}
.sb-link:hover { background: rgba(255,255,255,.06); color: #fff; }
.sb-link svg { width: 16px; height: 16px; }
.sb-link .arr { margin-left: auto; opacity: .5; }
.sb-user {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px 0;
}
.sb-user-ava {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #334155, #0f766e);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
}
.sb-user-name { font-size: 12.5px; color: #d7e4e0; }
.sb-user-role { font-size: 10.5px; color: var(--sb-text-dim); }

/* ================= 主区 ================= */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.chat-top {
    flex: none; height: 54px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 18px;
    background: rgba(246,248,247,.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    z-index: 5;
}
.expand-btn {
    display: none;
    background: none; border: 1px solid var(--border);
    width: 32px; height: 32px; border-radius: 8px;
    color: var(--text-2); align-items: center; justify-content: center;
}
body.collapsed .expand-btn { display: flex; }
.expand-btn:hover { background: #fff; }
.expand-btn svg { width: 16px; height: 16px; }
.chat-title {
    font-size: 14.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 46vw;
}
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.api-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-family: var(--mono);
    padding: 5px 12px; border-radius: 999px;
    background: #fef3f2; color: var(--danger);
    border: 1px solid #fecaca;
}
.api-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.api-pill.ok { background: #ecfdf3; color: #16a34a; border-color: #bbf7d0; }
.api-pill.ok .dot { animation: none; }

.goto-import {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600;
    color: var(--accent-strong);
    background: #e6f7f4; border: 1px solid #b8e8e0;
    padding: 6px 14px; border-radius: 9px;
    text-decoration: none;
    transition: background .15s;
}
.goto-import:hover { background: #d3f1ec; }
.goto-import svg { width: 14px; height: 14px; }

/* ================= 消息区 ================= */
.chat-scroll {
    flex: 1; overflow-y: auto;
    scroll-behavior: smooth;
}
.chat-inner {
    max-width: 780px; margin: 0 auto;
    padding: 26px 22px 20px;
}
.chat-scroll::-webkit-scrollbar { width: 8px; }
.chat-scroll::-webkit-scrollbar-thumb { background: #d3ddd9; border-radius: 4px; }

/* 欢迎屏 */
.hero {
    min-height: calc(100vh - 220px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 30px 16px 40px;
}
.hero-mark {
    width: 62px; height: 62px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 34px rgba(13,148,136,.35);
    margin-bottom: 22px;
}
.hero-mark svg { width: 32px; height: 32px; color: #fff; }
.hero-hi { font-size: 25px; font-weight: 700; letter-spacing: .5px; }
.hero-sub { font-size: 13.5px; color: var(--text-3); margin-top: 10px; line-height: 1.7; }
.hero-cards {
    margin-top: 30px;
    display: grid; grid-template-columns: repeat(2, minmax(230px, 290px)); gap: 12px;
    width: 100%; justify-content: center;
}
.hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    text-align: left; cursor: pointer;
    transition: border-color .15s, transform .12s, box-shadow .15s;
}
.hero-card:hover {
    border-color: var(--accent-2);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(13,148,136,.1);
}
.hero-card-q { font-size: 13px; font-weight: 600; color: var(--text-1); line-height: 1.5; }
.hero-card-tag {
    display: inline-block; margin-top: 7px;
    font-size: 10.5px; color: var(--accent-strong);
    background: #e6f7f4; padding: 2px 8px; border-radius: 5px;
}

/* 日期分隔 */
.day-divider {
    display: flex; align-items: center; gap: 14px;
    margin: 22px 0 14px; color: var(--text-3);
    font-size: 11.5px; letter-spacing: .5px;
}
.day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* 消息行 */
.msg { display: flex; gap: 12px; margin: 18px 0; animation: fadeUp .25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }

.msg.user { justify-content: flex-end; }
.msg.user .col { max-width: 76%; display: flex; flex-direction: column; align-items: flex-end; }
.user-bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    padding: 10px 16px;
    border-radius: 16px 16px 4px 16px;
    font-size: 14px; line-height: 1.75;
    word-break: break-word;
}

.msg.bot .bot-ava {
    flex: none;
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
    box-shadow: 0 3px 10px rgba(13,148,136,.25);
}
.msg.bot .bot-ava svg { width: 18px; height: 18px; color: #fff; }
.msg.bot .col { min-width: 0; flex: 1; max-width: calc(100% - 46px); }

.msg-meta { font-size: 11px; color: var(--text-3); margin-top: 6px; font-family: var(--mono); }
.msg.user .msg-meta { margin-top: 6px; }

/* AI 气泡（DeepSeek 式：无框全宽内容） */
.bot-body {
    background: transparent;
    padding: 2px 0 0;
    font-size: 14.5px; line-height: 1.85;
    word-break: break-word;
}
.answer { min-height: 20px; }

.typing { display: inline-flex; gap: 5px; padding: 8px 0; }
.typing .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: blink 1.2s infinite;
}
.typing .dot:nth-child(2) { animation-delay: .2s; }
.typing .dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }

details.progress {
    margin: 8px 0 4px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #fbfdfc;
    font-size: 12px; color: var(--text-3);
    overflow: hidden;
}
details.progress summary {
    cursor: pointer; user-select: none;
    padding: 7px 12px; list-style: none;
    display: flex; align-items: center; gap: 6px;
}
details.progress summary::before {
    content: '▸'; transition: transform .15s; font-size: 10px;
}
details.progress[open] summary::before { transform: rotate(90deg); }
details.progress ul { margin: 0; padding: 2px 12px 10px 26px; }
details.progress li { padding: 2px 0; font-family: var(--mono); }

.msg-actions {
    display: flex; gap: 4px; margin-top: 6px;
    opacity: 0; transition: opacity .15s;
}
.msg:hover .msg-actions { opacity: 1; }
.copy-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-3); font-size: 11px;
    padding: 3px 10px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 5px;
}
.copy-btn:hover { color: var(--accent-strong); border-color: var(--accent-2); }
.copy-btn svg { width: 12px; height: 12px; }

/* ================= 输入区（DeepSeek 式大气输入卡） ================= */
.composer-zone {
    flex: none;
    background: linear-gradient(to top, var(--bg) 70%, rgba(246,248,247,0));
    padding: 6px 22px 14px;
}
.composer {
    max-width: 780px; margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 6px 26px rgba(16,32,29,.07);
    padding: 14px 16px 10px;
    transition: border-color .15s, box-shadow .15s;
}
.composer:focus-within {
    border-color: var(--accent-2);
    box-shadow: 0 8px 30px rgba(13,148,136,.14);
}
.composer textarea {
    display: block; width: 100%;
    border: none; outline: none; resize: none;
    font-family: inherit; font-size: 14.5px; line-height: 1.7;
    color: var(--text-1);
    background: transparent;
    max-height: 180px;
    padding: 0 2px;
}
.composer textarea::placeholder { color: var(--text-3); }

.composer-bar {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px;
}
.mode-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    color: var(--text-2);
    background: #f0f4f2; border: 1px solid transparent;
    padding: 6px 13px; border-radius: 999px;
    transition: all .15s;
}
.mode-btn:hover { background: #e4ebe8; }
.mode-btn.on {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 2px 10px rgba(13,148,136,.3);
}
.mode-btn svg { width: 13px; height: 13px; }
.composer-bar .hint {
    font-size: 11px; color: var(--text-3);
    margin-left: 4px;
}
.send-btn {
    margin-left: auto;
    width: 36px; height: 36px; border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(13,148,136,.35);
    transition: filter .15s, transform .1s, opacity .15s;
}
.send-btn:hover { filter: brightness(1.1); }
.send-btn:active { transform: scale(.94); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.send-btn svg { width: 16px; height: 16px; }

.disclaimer {
    max-width: 780px; margin: 8px auto 0;
    text-align: center;
    font-size: 11px; color: var(--text-3);
}

/* Markdown 渲染 */
.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md h1,.md h2,.md h3,.md h4 { margin: 14px 0 8px; line-height: 1.4; }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
.md ul,.md ol { margin: 6px 0 10px; padding-left: 22px; }
.md li { margin: 3px 0; }
.md blockquote {
    margin: 8px 0; padding: 6px 14px;
    border-left: 3px solid var(--accent-2);
    background: #f2faf8; border-radius: 0 8px 8px 0;
    color: var(--text-2);
}
.md code {
    font-family: var(--mono); font-size: 12.8px;
    background: #eef2f0; padding: 2px 6px; border-radius: 5px;
    color: #0f766e;
}
.md pre {
    background: #10201d; color: #d7e4e0;
    border-radius: 10px; padding: 13px 15px;
    overflow-x: auto; margin: 10px 0;
}
.md pre code { background: none; padding: 0; color: inherit; font-size: 12.8px; line-height: 1.6; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
.md th,.md td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
.md th { background: #eef4f2; font-weight: 600; }
.md tr:nth-child(even) td { background: #fafcfb; }
.md a { color: var(--accent-strong); text-decoration: none; border-bottom: 1px dashed var(--accent-2); }
.md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.answer-images { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.answer-images img {
    max-width: 240px; max-height: 180px;
    border-radius: 10px; border: 1px solid var(--border);
    object-fit: cover;
}
.answer-images a { font-size: 11px; color: var(--text-3); word-break: break-all; }

@media (max-width: 760px) {
    .hero-cards { grid-template-columns: 1fr; }
    .chat-title { display: none; }
    .goto-import span { display: none; }
}
</style>
</head>
<body>
<div class="app">

    <!-- ============ 侧栏 ============ -->
    <aside class="sidebar">
        <div class="sb-top">
            <div class="sb-logo">
                <div class="sb-logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v6h-6"/></svg>
                </div>
                <div>
                    <div class="sb-logo-name">金融智库</div>
                    <div class="sb-logo-sub">FINANCE BRAIN</div>
                </div>
            </div>
            <button class="icon-btn" id="btnCollapse" title="收起侧栏">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
            </button>
        </div>

        <button class="new-chat" id="btnNewChat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            开启新对话
        </button>

        <div class="sb-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="sessionSearch" placeholder="搜索会话...">
        </div>

        <div class="sb-scroll" id="sessionList">
            <div class="sb-empty">暂无历史会话</div>
        </div>

        <div class="sb-footer">
            <a class="sb-link" id="gotoImport" href="javascript:void(0)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                数据导入
                <span class="arr">→</span>
            </a>
            <div class="sb-user">
                <div class="sb-user-ava">投</div>
                <div>
                    <div class="sb-user-name">投资者</div>
                    <div class="sb-user-role">本地知识库会话</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ============ 主区 ============ -->
    <main class="main">
        <header class="chat-top">
            <button class="expand-btn" id="btnExpand" title="展开侧栏">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
            </button>
            <div class="chat-title" id="chatTitle">新对话</div>
            <div class="top-right">
                <div class="api-pill" id="apiPill"><span class="dot"></span><span id="apiPillText">API: 检测中</span></div>
                <a class="goto-import" id="gotoImportTop" href="javascript:void(0)">

<script>
    /* ================= 基础配置 ================= */
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8002';
    const IMPORT_URL = 'http://127.0.0.1:8003/import.html';

    const chatScroll = document.getElementById('chatScroll');
    const msgArea = document.getElementById('msgArea');
    const hero = document.getElementById('hero');
    const inputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const streamToggle = document.getElementById('streamToggle');
    const btnClear = document.getElementById('btnClear');
    const btnNewChat = document.getElementById('btnNewChat');
    const btnCollapse = document.getElementById('btnCollapse');
    const btnExpand = document.getElementById('btnExpand');
    const sessionList = document.getElementById('sessionList');
    const sessionSearch = document.getElementById('sessionSearch');
    const apiPill = document.getElementById('apiPill');
    const apiPillText = document.getElementById('apiPillText');
    const chatTitle = document.getElementById('chatTitle');

    /* ================= 会话管理 ================= */
    function uuid() {
        return (crypto.randomUUID ? crypto.randomUUID() : 'sid-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    }
    let sessionId = localStorage.getItem('fb.currentSession') || uuid();
    localStorage.setItem('fb.currentSession', sessionId);

    /* ================= 工具函数 ================= */
    function escapeHtml(s) {
        return String(s === undefined || s === null ? '' : s)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    /* ================= 轻量 Markdown 渲染器 ================= */
    const md = (function(){
      function inline(text){
        const codeTokens = [];
        text = text.replace(/`([^`]+)`/g, (m, c) => {
          codeTokens.push(c);
          return `\u0000CODE${codeTokens.length - 1}\u0000`;
        });
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          (m, t, u) => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`);
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        text = text.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
        text = text.replace(/(^|[^_])_([^_]+)_/g, '$1<em>$2</em>');
        text = text.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => `<code>${codeTokens[+i]}</code>`);
        return text;
      }
      function parseTable(lines){
        if(lines.length < 2) return null;
        const sep = lines[1].trim();
        if(!/^\|?[\s:|-]+\|?$/.test(sep) || !sep.includes('---')) return null;
        const splitRow = (row) => row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
        const headers = splitRow(lines[0]);
        const body = lines.slice(2).map(splitRow);
        let html = '<table><thead><tr>';
        headers.forEach(h => html += `<th>${inline(escapeHtml(h))}</th>`);
        html += '</tr></thead><tbody>';
        body.forEach(row => {
          html += '<tr>';
          row.forEach(c => html += `<td>${inline(escapeHtml(c))}</td>`);
          html += '</tr>';
        });
        html += '</tbody></table>';
        return html;
      }
      function render(src){
        const raw = String(src || '').replace(/\r\n/g, '\n');
        const lines = raw.split('\n');
        let html = '';
        let i = 0;
        while(i < lines.length){
          const line = lines[i];
          if(/^\s*```/.test(line)){
            const lang = line.replace(/^\s*```/, '').trim();
            const buf = [];
            i++;
            while(i < lines.length && !/^\s*```/.test(lines[i])){
              buf.push(lines[i]);
              i++;
            }
            i++;
            const code = escapeHtml(buf.join('\n'));
            html += `<pre><code${lang ? ` class="language-${escapeHtml(lang)}"` : ''}>${code}</code></pre>`;
            continue;
          }
          if(line.trim() === ''){ i++; continue; }
          if(/^\s*([-*_])\1{2,}\s*$/.test(line)){
            html += '<hr>';
            i++;
            continue;
          }
          const h = line.match(/^(#{1,6})\s+(.*)$/);
          if(h){
            const lvl = h[1].length;
            html += `<h${lvl}>${inline(escapeHtml(h[2].trim()))}</h${lvl}>`;
            i++;
            continue;
          }
          if(/^\s*>/.test(line)){
            const buf = [];
            while(i < lines.length && /^\s*>/.test(lines[i])){
              buf.push(lines[i].replace(/^\s*>\s?/, ''));
              i++;
            }
            html += `<blockquote>${render(buf.join('\n'))}</blockquote>`;
            continue;
          }
          if(line.includes('|') && i + 1 < lines.length && lines[i+1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
            const block = [line];
            let j = i + 1;
            while(j < lines.length && lines[j].trim() !== '' && lines[j].includes('|')){
              block.push(lines[j]);
              j++;
            }
            const tbl = parseTable(block);
            if(tbl){
              html += tbl;
              i = j;
              continue;
            }
          }
          if(/^\s*[-*+]\s+/.test(line)){
            html += '<ul>';
            while(i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){
              const content = lines[i].replace(/^\s*[-*+]\s+/, '');
              html += `<li>${inline(escapeHtml(content))}</li>`;
              i++;
            }
            html += '</ul>';
            continue;
          }
          if(/^\s*\d+\.\s+/.test(line)){
            html += '<ol>';
            while(i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){
              const content = lines[i].replace(/^\s*\d+\.\s+/, '');
              html += `<li>${inline(escapeHtml(content))}</li>`;
              i++;
            }
            html += '</ol>';
            continue;
          }
          const para = [];
          while(i < lines.length
                && lines[i].trim() !== ''
                && !/^\s*```/.test(lines[i])
                && !/^#{1,6}\s+/.test(lines[i])
                && !/^\s*>/.test(lines[i])
                && !/^\s*[-*+]\s+/.test(lines[i])
                && !/^\s*\d+\.\s+/.test(lines[i])
                && !/^\s*([-*_])\1{2,}\s*$/.test(lines[i])
                && !(lines[i].includes('|') && i+1 < lines.length && lines[i+1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))
               ){
            para.push(lines[i]);
            i++;
          }
          if(para.length){
            html += `<p>${inline(escapeHtml(para.join('\n')))}</p>`;
          }
        }
        return html;
      }
      return { render };
    })();

    /* ================= 图片解析与假图过滤 ================= */
    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }
    const PLACEHOLDER_DOMAINS = ['example.com','example.org','example.net','example.edu'];
    function isPlaceholderImageUrl(url){
      try {
        const host = (new URL(url)).hostname.toLowerCase();
        return PLACEHOLDER_DOMAINS.some(d => host === d || host.endsWith('.' + d));
      } catch (e) { return false; }
    }
    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }
    function dedupeKeepOrder(arr){
      const seen = new Set(); const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v || seen.has(v)) continue;
        seen.add(v); out.push(v);
      }
      return out;
    }
    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }
    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m; let lastIdx = -1; let lastLen = 0;
      while((m = re.exec(s)) !== null){ lastIdx = m.index; lastLen = m[0].length; }
      return { idx: lastIdx, len: lastLen };
    }
    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };
      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')) urls.push(line);
        else for(const u of extractUrlsLoose(line)) urls.push(u);
      }
      const seen = new Set(); const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized) || seen.has(normalized) || isPlaceholderImageUrl(normalized)) continue;
        seen.add(normalized); images.push(normalized);
      }
      return { text: before, images };
    }
    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(u => isImageUrl(u) && !isPlaceholderImageUrl(u)) : [];
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(u => isImageUrl(u) && !isPlaceholderImageUrl(u));
      const allImages = new Set([
        ...(imagesFromBlock && imagesFromBlock.length ? imagesFromBlock : []),
        ...candidates, ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.innerHTML = '';

      const textEl = document.createElement('div');
      textEl.className = 'md';
      if((text || '').trim().length > 0){
        textEl.innerHTML = md.render(text);
      }else{
        textEl.innerHTML = '<p style="color:var(--text-3)">（已完成，但未返回答案）</p>';
      }
      containerEl.appendChild(textEl);

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => { img.style.display = 'none'; });
          imgWrap.appendChild(img);
          const link = document.createElement('a');
          link.href = safeUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    /* ================= 时间与日期分组 ================= */
    function tsToDate(ts) {
      if(!ts) return new Date();
      const n = Number(ts);
      // 秒级时间戳（含浮点秒，如 1792460286.447879）转毫秒；1e12 毫秒 ≈ 2001-09-09，可可靠区分
      return new Date(n > 1e12 ? n : n * 1000);
    }
    function formatTime(ts) {
      const d = tsToDate(ts);
      const p = (x) => String(x).padStart(2, '0');
      return `${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function dayKey(ts) {
      const d = tsToDate(ts);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diffDays = Math.round((today - that) / 86400000);
      if(diffDays === 0) return '今天';
      if(diffDays === 1) return '昨天';
      if(diffDays < 7) return '7 天内';
      if(diffDays < 30) return '30 天内';
      return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
    }
    let lastDayKeyRendered = null;
    function appendDayDividerIfNeeded(ts) {
      const key = dayKey(ts);
      if(key !== lastDayKeyRendered) {
        lastDayKeyRendered = key;
        const div = document.createElement('div');
        div.className = 'day-divider';
        div.textContent = key;
        msgArea.appendChild(div);
      }
    }

    /* ================= 消息渲染 ================= */
    function scrollToBottom() {
        requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
    }
    function hideHero() { hero.style.display = 'none'; }

    const BOT_AVA_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="12.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12.5" r="1" fill="currentColor" stroke="none"/></svg>';
    const COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

    function addUserMsg(text, ts) {
        hideHero();
        appendDayDividerIfNeeded(ts);
        const row = document.createElement('div');
        row.className = 'msg user';
        const col = document.createElement('div');
        col.className = 'col';
        const bubble = document.createElement('div');
        bubble.className = 'user-bubble';
        bubble.textContent = text;
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        meta.textContent = formatTime(ts);
        col.appendChild(bubble); col.appendChild(meta);
        row.appendChild(col);
        msgArea.appendChild(row);
        scrollToBottom();
    }

    function addBotMsg(ts) {
        hideHero();
        appendDayDividerIfNeeded(ts);
        const id = 'bot-' + Math.random().toString(36).slice(2);
        const row = document.createElement('div');
        row.className = 'msg bot';
        row.id = id;
        row.innerHTML = `
            <div class="bot-ava">${BOT_AVA_SVG}</div>
            <div class="col">
                <div class="bot-body">
                    <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
                    <details class="progress" open>
                        <summary>检索与生成进度（等待中）</summary>
                        <ul></ul>
                    </details>
                    <div class="answer md" style="display:none"></div>
                </div>
                <div class="msg-meta">${formatTime(ts)}</div>
            </div>`;
        msgArea.appendChild(row);
        scrollToBottom();
        return row;
    }

    function addBotHistoryMsg(text, ts, imageUrls) {
        const row = addBotMsg(ts);
        finalizeBotAnswer(row, text, '', imageUrls);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
        const details = botMsgEl.querySelector('details.progress');
        if(!details) return;
        const summary = details.querySelector('summary');
        const ul = details.querySelector('ul');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const statusMap = { processing:'处理中', completed:'已完成', failed:'失败', pending:'等待中' };
        const displayStatus = statusMap[status] || status || 'unknown';
        summary.textContent = `检索与生成进度（已完成${done.length}，进行中${running.length}，状态：${displayStatus}）`;
        const lines = [...done.map(x => `✅ ${x}`), ...running.map(x => `⏳ ${x}`)];
        ul.innerHTML = '';
        if(lines.length === 0){
            ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
        }else{
            for(const line of lines){
                ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
            }
        }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        const progress = botMsgEl.querySelector('details.progress');
        const body = botMsgEl.querySelector('.bot-body');
        const err = (error || '').trim();

        // 若已有流式渲染出的 answer 容器则复用，否则新建
        let answerEl = botMsgEl.querySelector('.answer');
        if(!answerEl){
            answerEl = document.createElement('div');
            answerEl.className = 'answer md';
            body.appendChild(answerEl);
        }
        answerEl.style.display = '';

        if(err){
            answerEl.innerHTML = `<p style="color:var(--danger)">抱歉，本次处理失败：${escapeHtml(err)}</p>`;
        }else{
            renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
        }

        if(progress){
            progress.removeAttribute('open');
            if(err) progress.remove();
        }

        // 复制按钮
        if(!err && (answer || '').trim()){
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.innerHTML = `${COPY_SVG}复制`;
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(answer).then(() => {
                    btn.innerHTML = `${COPY_SVG}已复制`;
                    setTimeout(() => { btn.innerHTML = `${COPY_SVG}复制`; }, 1500);
                });
            });
            actions.appendChild(btn);
            body.appendChild(actions);
        }
    }

    /* ================= 侧栏会话列表 ================= */
    const sessionsCache = [];

    function sessionGroup(ts) {
        return dayKey(ts);
    }

    function loadSessions() {
        return fetch(`${API_BASE}/sessions`)
            .then(r => r.ok ? r.json() : { sessions: [] })
            .then(data => {
                sessionsCache.length = 0;
                sessionsCache.push(...(Array.isArray(data.sessions) ? data.sessions : []));
                renderSessionList(sessionSearch.value.trim());
            })
            .catch(() => {
                sessionsCache.length = 0;
                renderSessionList('');
            });
    }

    function renderSessionList(filter) {
        sessionList.innerHTML = '';
        const list = sessionsCache.filter(s =>
            !filter || (s.title || '').toLowerCase().includes(filter.toLowerCase())
        );
        if(list.length === 0){
            sessionList.innerHTML = '<div class="sb-empty">' + (filter ? '没有匹配的会话' : '暂无历史会话') + '</div>';
            return;
        }
        // 分组：今天 / 昨天 / 7 天内 / 30 天内 / 更早（与 dayKey 一致）
        const groups = [];
        const index = {};
        for(const s of list){
            const g = sessionGroup(s.last_ts);
            if(!(g in index)){
                index[g] = groups.length;
                groups.push({ label: g, items: [] });
            }
            groups[index[g]].items.push(s);
        }
        for(const g of groups){
            const label = document.createElement('div');
            label.className = 'sb-group-label';
            label.textContent = g.label;
            sessionList.appendChild(label);
            for(const s of g.items){
                const item = document.createElement('div');
                item.className = 'session-item' + (s.session_id === sessionId ? ' active' : '');
                item.dataset.sid = s.session_id;

                const title = document.createElement('div');
                title.className = 'session-title';
                title.textContent = s.title || '新对话';
                title.title = s.title || '';

                const del = document.createElement('button');
                del.className = 'session-del';
                del.title = '删除会话';
                del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteSession(s.session_id);
                });

                item.appendChild(title);
                item.appendChild(del);
                item.addEventListener('click', () => selectSession(s.session_id));
                sessionList.appendChild(item);
            }
        }
    }

    async function deleteSession(sid) {
        if(!confirm('确定删除该会话的全部记录吗？此操作无法恢复。')) return;
        try{
            await fetch(`${API_BASE}/history/${sid}`, { method: 'DELETE' });
        }catch(_){}
        const idx = sessionsCache.findIndex(s => s.session_id === sid);
        if(idx >= 0) sessionsCache.splice(idx, 1);
        if(sid === sessionId){
            newSession();
        }else{
            renderSessionList(sessionSearch.value.trim());
        }
    }

    function selectSession(sid) {
        if(sid === sessionId) return;
        sessionId = sid;
        localStorage.setItem('fb.currentSession', sessionId);
        clearMsgArea();
        loadHistory();
        renderSessionList(sessionSearch.value.trim());
    }

    function newSession() {
        sessionId = uuid();
        localStorage.setItem('fb.currentSession', sessionId);
        clearMsgArea();
        hero.style.display = '';
        chatTitle.textContent = '新对话';
        renderSessionList(sessionSearch.value.trim());
        inputEl.focus();
    }

    function clearMsgArea() {
        msgArea.innerHTML = '';
        lastDayKeyRendered = null;
    }

    function updateTitleFromHistory(firstUserText) {
        if(firstUserText){
            chatTitle.textContent = firstUserText.length > 24 ? firstUserText.slice(0, 24) + '…' : firstUserText;
        }else{
            chatTitle.textContent = '新对话';
        }
    }

    /* ================= 历史加载 ================= */
    async function loadHistory() {
        try{
            const res = await fetch(`${API_BASE}/history/${sessionId}`);
            if(!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data.items) ? data.items : [];
            if(items.length === 0){ chatTitle.textContent = '新对话'; return; }
            items.reverse();
            clearMsgArea();
            let firstUser = '';
            for(const item of items){
                const ts = item.ts;
                if(item.role === 'user'){
                    if(!firstUser) firstUser = item.text || '';
                    addUserMsg(item.text || '', ts);
                }else{
                    addBotHistoryMsg(item.text || '', ts, item.image_urls || []);
                }
            }
            updateTitleFromHistory(firstUser);
            scrollToBottom();
        }catch(_){}
    }

    /* ================= 发送与流式 ================= */
    async function onSend() {
        const text = (inputEl.value || '').trim();
        if(!text || sendBtn.disabled) return;
        inputEl.value = '';
        autoGrow();
        addUserMsg(text, Date.now() / 1000);
        if(chatTitle.textContent === '新对话') updateTitleFromHistory(text);
        const botMsgEl = addBotMsg(Date.now() / 1000);
        sendBtn.disabled = true;

        try{
            const isStream = streamToggle.classList.contains('on');
            const res = await fetch(`${API_BASE}/query`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: text, session_id: sessionId, is_stream: isStream })
            });
            if(!res.ok){
                const msg = await res.text();
                throw new Error(msg || '请求失败');
            }
            const data = await res.json();
            renderProgress(botMsgEl, [], [], 'pending');

            if(!isStream){
                renderProgress(botMsgEl, data.done_list || [], [], 'completed');
                finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
                sendBtn.disabled = false;
                loadSessions();
                return;
            }

            const { session_id } = data;
            const answerEl = botMsgEl.querySelector('.answer');
            let rawAnswerText = '';

            const es = new EventSource(`${API_BASE}/stream/${session_id}`);

            es.addEventListener('progress', (e) => {
                try{
                    const d = JSON.parse(e.data || '{}');
                    renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
                    if(d && d.status === 'completed'){
                        const typing = botMsgEl.querySelector('.typing');
                        if(typing) typing.remove();
                    }
                }catch(_){}
            });

            es.addEventListener('delta', (e) => {
                try{
                    const d = JSON.parse(e.data || '{}');
                    const delta = d.delta || '';
                    if(delta){
                        rawAnswerText += delta;
                        answerEl.style.display = '';
                        renderAnswerWithImages(answerEl, rawAnswerText, []);
                        // 流式开始后折叠进度条，突出答案
                        const progress = botMsgEl.querySelector('details.progress');
                        if(progress) progress.removeAttribute('open');
                        scrollToBottom();
                    }
                }catch(_){}
            });

            function handleFinal(e){
                const typing = botMsgEl.querySelector('.typing');
                if(typing) typing.remove();
                try{
                    const d = JSON.parse(e.data || '{}');
                    const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0)
                        ? d.answer : (rawAnswerText || answerEl.textContent || '');
                    finalizeBotAnswer(botMsgEl, finalText, '', d.image_urls || []);
                }catch(_){}
                es.close();
                sendBtn.disabled = false;
                loadSessions();
            }
            es.addEventListener('final', handleFinal);
            es.addEventListener('final_answer', handleFinal);

            es.addEventListener('error', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if(typing) typing.remove();
                let msg = 'SSE 连接中断/失败';
                try{
                    if(e && e.data){ msg = JSON.parse(e.data).error || msg; }
                }catch(_){}
                finalizeBotAnswer(botMsgEl, rawAnswerText || '', msg, []);
                es.close();
                sendBtn.disabled = false;
            });
        }catch(e){
            finalizeBotAnswer(botMsgEl, '', e.message || String(e), []);
            sendBtn.disabled = false;
        }
    }

    /* ================= 输入框自适应 ================= */
    function autoGrow() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    }
    inputEl.addEventListener('input', autoGrow);

    /* ================= 事件绑定 ================= */
    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); onSend(); }
    });

    streamToggle.addEventListener('click', () => {
        streamToggle.classList.toggle('on');
    });

    btnNewChat.addEventListener('click', newSession);

    btnClear.addEventListener('click', async () => {
        if(!confirm('确定要清空当前会话的云端历史记录吗？这将无法恢复。')) return;
        try{
            const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
            if(!res.ok) alert('服务端清空失败，仅清空本地显示');
        }catch(e){ alert('服务端清空失败，仅清空本地显示'); }
        clearMsgArea();
        hero.style.display = '';
        chatTitle.textContent = '新对话';
        loadSessions();
    });

    sessionSearch.addEventListener('input', () => renderSessionList(sessionSearch.value.trim()));

    // 侧栏收起/展开（记住状态）
    function applyCollapsed(collapsed) {
        document.body.classList.toggle('collapsed', collapsed);
        localStorage.setItem('fb.sbCollapsed', collapsed ? '1' : '0');
    }
    btnCollapse.addEventListener('click', () => applyCollapsed(true));
    btnExpand.addEventListener('click', () => applyCollapsed(false));
    applyCollapsed(localStorage.getItem('fb.sbCollapsed') === '1');

    // 跳转到导入页
    document.getElementById('gotoImport').addEventListener('click', () => { location.href = IMPORT_URL; });
    document.getElementById('gotoImportTop').addEventListener('click', () => { location.href = IMPORT_URL; });

    // 欢迎屏建议问题卡片
    document.querySelectorAll('.hero-card').forEach(card => {
        card.addEventListener('click', () => {
            inputEl.value = card.dataset.q || '';
            autoGrow();
            onSend();
        });
    });

    /* ================= 服务健康检查 ================= */
    async function apiHealth(){
        try{
            const res = await fetch(`${API_BASE}/health`);
            if(!res.ok) throw new Error('health not ok');
            apiPill.classList.add('ok');
            apiPillText.textContent = 'API: 已连接';
        }catch(e){
            apiPill.classList.remove('ok');
            apiPillText.textContent = 'API: 未连接';
        }
    }

    /* ================= 初始化 ================= */
    apiHealth();
    setInterval(apiHealth, 8000);
    loadSessions();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
</script>
</body>
