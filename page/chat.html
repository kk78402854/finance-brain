<!-- 查询演示页面，用于体验普通问答与流式响应。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>金融知识库</title>
  <style>
    :root{
      --bg:#eef2f7;
      --panel:#ffffff;
      --text:#1f2d3d;
      --muted:#8a94a6;
      --brand:#2f6bff;
      --brand2:#7c4dff;
      --brand-soft:rgba(47,107,255,.10);
      --bubble-user:linear-gradient(135deg,#2f6bff,#7c4dff);
      --bubble-bot:#ffffff;
      --border:#e7ebf2;
      --border-soft:#eef1f6;
      --shadow:0 20px 60px rgba(31,45,61,.14);
      --radius:18px;
      --code-bg:#f4f6fb;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "PingFang SC","Microsoft YaHei","Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 15% -5%, rgba(47,107,255,.22), transparent 60%),
        radial-gradient(1000px 500px at 100% 5%, rgba(124,77,255,.20), transparent 55%),
        radial-gradient(900px 500px at 50% 110%, rgba(0,200,200,.12), transparent 55%),
        var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      -webkit-font-smoothing:antialiased;
    }
    .app{
      width:100%;
      max-width:1000px;
      height:min(860px, 94vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    /* ===== Topbar ===== */
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(100deg, rgba(47,107,255,.10), rgba(124,77,255,.10));
      backdrop-filter:blur(8px);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:260px}
    .logo{
      width:40px;height:40px;border-radius:12px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 8px 18px rgba(47,107,255,.35);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:18px;
    }
    .title{display:flex;flex-direction:column;line-height:1.15}
    .title strong{font-size:15px;font-weight:600}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .stream-toggle{
      font-size:12px;display:flex;align-items:center;gap:6px;
      cursor:pointer;user-select:none;color:var(--muted);
    }
    .stream-toggle input{accent-color:var(--brand)}
    .pill{
      font-size:12px;color:var(--muted);
      border:1px solid var(--border);
      padding:6px 12px;border-radius:999px;
      background:#fff;
    }
    .pill.ok{color:#16a34a;border-color:rgba(22,163,74,.3);background:rgba(22,163,74,.06)}
    .btn{
      border:none;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;padding:8px 14px;border-radius:10px;
      font-size:12px;cursor:pointer;transition:transform .15s, box-shadow .15s;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(47,107,255,.3)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

    /* ===== Chat area ===== */
    .chat{
      flex:1;
      overflow:auto;
      padding:22px 20px 14px;
      background:
        linear-gradient(180deg, rgba(47,107,255,.04), transparent 40%),
        linear-gradient(0deg, rgba(124,77,255,.04), transparent 45%);
      scroll-behavior:smooth;
    }
    .chat::-webkit-scrollbar{width:8px}
    .chat::-webkit-scrollbar-thumb{background:#d5dbe6;border-radius:8px}
    .chat::-webkit-scrollbar-thumb:hover{background:#c0c8d6}

    .dayline{
      text-align:center;color:var(--muted);font-size:12px;
      margin:4px 0 16px;
    }
    .dayline span{
      background:rgba(138,148,166,.12);padding:3px 12px;border-radius:999px;
    }

    .msg{display:flex;gap:10px;margin:14px 0;align-items:flex-end}
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){flex:1;min-width:0}
    .msg.user > div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end}

    .avatar{
      width:38px;height:38px;border-radius:12px;
      background:#eef1f7;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;font-weight:600;color:#3b4a5a;
      flex:0 0 auto;
      box-shadow:0 4px 10px rgba(31,45,61,.08);
    }
    .avatar.bot{
      background:linear-gradient(135deg,rgba(47,107,255,.16),rgba(124,77,255,.16));
      color:var(--brand);
    }
    .avatar.user{
      background:linear-gradient(135deg,#fbbf24,#f97316);
      color:#fff;
    }

    .bubble{
      max-width:min(760px,78%);
      display:inline-block;
      border-radius:16px;
      padding:12px 15px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      position:relative;
      line-height:1.7;
      font-size:14.5px;
      overflow-wrap:break-word;
      word-break:break-word;
      box-shadow:0 4px 14px rgba(31,45,61,.05);
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;border-color:transparent;
      box-shadow:0 6px 18px rgba(47,107,255,.28);
    }
    .meta{font-size:11px;color:var(--muted);margin-top:6px}
    .msg.user .meta{color:rgba(255,255,255,.85)}

    /* ===== Markdown rendered content ===== */
    .md{line-height:1.75;font-size:14.5px}
    .md p{margin:0 0 10px}
    .md p:last-child{margin-bottom:0}
    .md h1,.md h2,.md h3,.md h4{
      margin:16px 0 10px;font-weight:600;line-height:1.35;
    }
    .md h1{font-size:20px}
    .md h2{
      font-size:17px;
      padding-bottom:6px;
      border-bottom:2px solid var(--brand-soft);
    }
    .md h3{font-size:15.5px;color:var(--brand)}
    .md h4{font-size:14.5px}
    .md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:4px}
    .md strong{font-weight:600}
    .md em{font-style:italic}
    .md ul,.md ol{margin:8px 0 12px;padding-left:22px}
    .md li{margin:4px 0}
    .md ul li::marker{color:var(--brand)}
    .md ol li::marker{color:var(--brand);font-weight:600}
    .md a{color:var(--brand);text-decoration:none;border-bottom:1px dashed rgba(47,107,255,.4)}
    .md a:hover{border-bottom-style:solid}
    .md blockquote{
      margin:10px 0;padding:8px 14px;
      border-left:4px solid var(--brand);
      background:var(--brand-soft);
      border-radius:0 10px 10px 0;
      color:#4a5568;
    }
    .md blockquote p{margin:0}
    .md code{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size:13px;
      background:var(--code-bg);
      padding:1px 6px;
      border-radius:5px;
      color:#d6336c;
    }
    .md pre{
      background:#1e293b;
      color:#e2e8f0;
      padding:12px 14px;
      border-radius:10px;
      overflow-x:auto;
      margin:10px 0;
    }
    .md pre code{
      background:transparent;color:inherit;padding:0;
      font-size:13px;line-height:1.6;
    }
    .md hr{border:none;border-top:1px solid var(--border);margin:14px 0}
    .md table{
      border-collapse:collapse;margin:10px 0;width:100%;
      font-size:13.5px;
    }
    .md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
    .md th{background:var(--code-bg);font-weight:600}

    /* user bubble markdown override (on colored bg) */
    .msg.user .md h2{border-color:rgba(255,255,255,.35)}
    .msg.user .md code{background:rgba(255,255,255,.22);color:#fff}
    .msg.user .md a{color:#fff;border-bottom-color:rgba(255,255,255,.6)}
    .msg.user .md blockquote{background:rgba(255,255,255,.16);border-color:#fff;color:#fff}
    .msg.user .md ul li::marker,.msg.user .md ol li::marker{color:#fff}

    /* ===== Progress ===== */
    details.progress{
      margin-top:10px;
      border:1px dashed rgba(138,148,166,.45);
      border-radius:12px;
      padding:8px 12px;
      background:rgba(138,148,166,.06);
    }
    details.progress summary{
      cursor:pointer;user-select:none;color:var(--muted);font-size:12.5px;
    }
    details.progress summary::-webkit-details-marker{color:var(--brand)}
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12.5px;color:#56657a;line-height:1.5}

    /* ===== Images ===== */
    .answer-images{margin-top:12px;display:flex;flex-direction:column;gap:10px}
    .answer-images img{
      display:block;max-width:min(100%,600px);max-height:600px;
      width:auto;height:auto;border-radius:12px;border:1px solid var(--border);
      box-shadow:0 10px 24px rgba(31,45,61,.10);background:#fff;
    }
    .answer-images a{
      font-size:12px;color:var(--muted);text-decoration:none;word-break:break-all;
    }

    /* ===== Typing indicator ===== */
    .typing{display:inline-flex;gap:6px;align-items:center;padding:4px 0}
    .dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--brand);
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s;background:var(--brand2)}
    .dot:nth-child(3){animation-delay:.3s;background:#7c4dff}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.5}
      40%{transform:translateY(-5px);opacity:1}
    }

    /* ===== Composer ===== */
    .composer{
      border-top:1px solid var(--border);
      padding:14px 16px;
      display:flex;gap:10px;align-items:flex-end;
      background:#fff;
    }
    textarea{
      flex:1;resize:none;
      min-height:46px;max-height:160px;
      padding:12px 14px;border-radius:14px;
      border:1px solid var(--border);
      outline:none;font-size:14.5px;line-height:1.55;
      transition:border-color .15s, box-shadow .15s;
      font-family:inherit;
    }
    textarea:focus{
      border-color:rgba(47,107,255,.55);
      box-shadow:0 0 0 4px rgba(47,107,255,.12);
    }
    .send{
      width:92px;height:46px;border:none;border-radius:14px;
      cursor:pointer;font-size:14.5px;color:#fff;font-weight:500;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      transition:transform .15s, box-shadow .15s;
    }
    .send:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(47,107,255,.35)}
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{
      padding:0 16px 12px;color:var(--muted);font-size:12px;background:#fff;
    }
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      border:1px solid var(--border);padding:1px 6px;border-radius:6px;
      background:#f7f9fc;color:#3b4a5a;font-size:11.5px;
    }

    @media (max-width:640px){
      body{padding:0}
      .app{height:100vh;border-radius:0}
      .bubble{max-width:86%}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">🎧</div>
        <div class="title">
          <strong>金融知识库</strong>
          <span id="subTitle">在线 · 可查询金融库与联网信息</span>
        </div>
      </div>
      <div class="top-actions">
        <label class="stream-toggle">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline"><span>今天</span></div>
      <div class="msg bot">
        <div class="avatar bot">🤖</div>
        <div>
          <div class="bubble">你好，我是金融知识库助手 🤖。你可以直接提问，我会在"阶段进度"里展示处理过程。</div>
          <div class="meta">提示：可以问"易方达智造优势混合基金主要投资什么？"</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <script>
    // 默认走查询服务同源地址；如你把页面单独打开（file://），回退到查询服务默认端口。
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    /* ============================================================
     * 轻量 Markdown 渲染器
     * 先 escapeHtml 防 XSS，再按行/块解析：标题、列表、引用、代码块、
     * 表格、分隔线、段落，最后做行内样式（粗体/斜体/行内代码/链接）。
     * ============================================================ */
    const md = (function(){
      function inline(text){
        // 先保护代码片段，避免其中的 * _ 被误解析
        const codeTokens = [];
        text = text.replace(/`([^`]+)`/g, (m, c) => {
          codeTokens.push(c);
          return `\u0000CODE${codeTokens.length - 1}\u0000`;
        });
        // 链接 [text](url)
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          (m, t, u) => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`);
        // 粗体 **text** 或 __text__
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        // 斜体 *text* 或 _text_
        text = text.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
        text = text.replace(/(^|[^_])_([^_]+)_/g, '$1<em>$2</em>');
        // 还原代码片段
        text = text.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => `<code>${codeTokens[+i]}</code>`);
        return text;
      }

      function parseTable(lines){
        if(lines.length < 2) return null;
        const sep = lines[1].trim();
        if(!/^\|?[\s:|-]+\|?$/.test(sep) || !sep.includes('---')) return null;
        const splitRow = (row) => row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
        const headers = splitRow(lines[0]);
        const body = lines.slice(2).map(splitRow);
        let html = '<table><thead><tr>';
        headers.forEach(h => html += `<th>${inline(escapeHtml(h))}</th>`);
        html += '</tr></thead><tbody>';
        body.forEach(row => {
          html += '<tr>';
          row.forEach(c => html += `<td>${inline(escapeHtml(c))}</td>`);
          html += '</tr>';
        });
        html += '</tbody></table>';
        return html;
      }

      function render(src){
        const raw = String(src || '').replace(/\r\n/g, '\n');
        const lines = raw.split('\n');
        let html = '';
        let i = 0;

        while(i < lines.length){
          const line = lines[i];

          // 代码块 ```
          if(/^\s*```/.test(line)){
            const lang = line.replace(/^\s*```/, '').trim();
            const buf = [];
            i++;
            while(i < lines.length && !/^\s*```/.test(lines[i])){
              buf.push(lines[i]);
              i++;
            }
            i++; // skip closing ```
            const code = escapeHtml(buf.join('\n'));
            html += `<pre><code${lang ? ` class="language-${escapeHtml(lang)}"` : ''}>${code}</code></pre>`;
            continue;
          }

          // 空行
          if(line.trim() === ''){ i++; continue; }

          // 分隔线
          if(/^\s*([-*_])\1{2,}\s*$/.test(line)){
            html += '<hr>';
            i++;
            continue;
          }

          // 标题
          const h = line.match(/^(#{1,6})\s+(.*)$/);
          if(h){
            const lvl = h[1].length;
            html += `<h${lvl}>${inline(escapeHtml(h[2].trim()))}</h${lvl}>`;
            i++;
            continue;
          }

          // 引用块 >
          if(/^\s*>/.test(line)){
            const buf = [];
            while(i < lines.length && /^\s*>/.test(lines[i])){
              buf.push(lines[i].replace(/^\s*>\s?/, ''));
              i++;
            }
            html += `<blockquote>${render(buf.join('\n'))}</blockquote>`;
            continue;
          }

          // 表格（连续行，含分隔行）
          if(line.includes('|') && i + 1 < lines.length && lines[i+1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
            const block = [line];
            let j = i + 1;
            while(j < lines.length && lines[j].trim() !== '' && lines[j].includes('|')){
              block.push(lines[j]);
              j++;
            }
            const tbl = parseTable(block);
            if(tbl){
              html += tbl;
              i = j;
              continue;
            }
          }

          // 无序列表
          if(/^\s*[-*+]\s+/.test(line)){
            html += '<ul>';
            while(i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){
              const content = lines[i].replace(/^\s*[-*+]\s+/, '');
              html += `<li>${inline(escapeHtml(content))}</li>`;
              i++;
            }
            html += '</ul>';
            continue;
          }

          // 有序列表
          if(/^\s*\d+\.\s+/.test(line)){
            html += '<ol>';
            while(i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){
              const content = lines[i].replace(/^\s*\d+\.\s+/, '');
              html += `<li>${inline(escapeHtml(content))}</li>`;
              i++;
            }
            html += '</ol>';
            continue;
          }

          // 普通段落（合并连续非空行，直到遇到空行或块级元素起始）
          const para = [];
          while(i < lines.length
                && lines[i].trim() !== ''
                && !/^\s*```/.test(lines[i])
                && !/^#{1,6}\s+/.test(lines[i])
                && !/^\s*>/.test(lines[i])
                && !/^\s*[-*+]\s+/.test(lines[i])
                && !/^\s*\d+\.\s+/.test(lines[i])
                && !/^\s*([-*_])\1{2,}\s*$/.test(lines[i])
                && !(lines[i].includes('|') && i+1 < lines.length && lines[i+1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))
               ){
            para.push(lines[i]);
            i++;
          }
          if(para.length){
            html += `<p>${inline(escapeHtml(para.join('\n')))}</p>`;
          }
        }

        return html;
      }
      return { render };
    })();

    /* ============================
     * 图片解析（保持原逻辑）
     * ============================ */
    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }
    // 占位/示例域名黑名单：LLM 编造的假图片链接一律过滤
    const PLACEHOLDER_DOMAINS = ['example.com','example.org','example.net','example.edu'];
    function isPlaceholderImageUrl(url){
      try {
        const host = (new URL(url)).hostname.toLowerCase();
        return PLACEHOLDER_DOMAINS.some(d => host === d || host.endsWith('.' + d));
      } catch (e) { return false; }
    }
    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }
    function dedupeKeepOrder(arr){
      const seen = new Set(); const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v || seen.has(v)) continue;
        seen.add(v); out.push(v);
      }
      return out;
    }
    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }
    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m; let lastIdx = -1; let lastLen = 0;
      while((m = re.exec(s)) !== null){ lastIdx = m.index; lastLen = m[0].length; }
      return { idx: lastIdx, len: lastLen };
    }
    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };
      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')) urls.push(line);
        else for(const u of extractUrlsLoose(line)) urls.push(u);
      }
      const seen = new Set(); const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized) || seen.has(normalized) || isPlaceholderImageUrl(normalized)) continue;
        seen.add(normalized); images.push(normalized);
      }
      return { text: before, images };
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(u => isImageUrl(u) && !isPlaceholderImageUrl(u)) : [];
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(u => isImageUrl(u) && !isPlaceholderImageUrl(u));
      const allImages = new Set([
        ...(imagesFromBlock && imagesFromBlock.length ? imagesFromBlock : []),
        ...candidates, ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.innerHTML = '';

      const textEl = document.createElement('div');
      textEl.className = 'md';
      if((text || '').trim().length > 0){
        textEl.innerHTML = md.render(text);
      }else{
        textEl.innerHTML = '<p style="color:var(--muted)">（已完成，但未返回答案）</p>';
      }
      containerEl.appendChild(textEl);

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => { img.style.display = 'none'; });
          imgWrap.appendChild(img);
          const link = document.createElement('a');
          link.href = safeUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    /* ============================
     * 消息渲染
     * ============================ */
    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble"><div class="md">${md.render(escapeHtml(text))}</div></div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar user">我</div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }
    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble"><div class="md">${md.render(escapeHtml(text))}</div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar user">我</div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }
    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div>
            <div class="bubble"><div class="answer md"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }
    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div style="min-width:180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const statusMap = { processing:'处理中', completed:'已完成', failed:'失败', pending:'等待中' };
      const displayStatus = statusMap[status] || status || 'unknown';
      summary.textContent = `阶段进度（已完成${done.length}，进行中${running.length}，状态：${displayStatus}）`;
      const lines = [...done.map(x => `✅ ${x}`), ...running.map(x => `⏳ ${x}`)];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        if(progress){ progress.remove(); progress.removeAttribute('open'); }
        bubble.innerHTML = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer md';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progress) bubble.appendChild(progress);
        return;
      }
      if(progress){ progress.remove(); progress.removeAttribute('open'); }
      bubble.innerHTML = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer md';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progress) bubble.appendChild(progress);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = 'API: 已连接';
        apiPill.classList.add('ok');
      }catch(e){
        apiPill.textContent = 'API: 未连接';
        apiPill.classList.remove('ok');
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        items.reverse();
        for(const item of items){
          if(item.role === 'user') addUserMsgWithTime(item.text || '', item.ts);
          else addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ query:text, session_id:sessionId, is_stream:isStream })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);
          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval); sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval); sendBtn.disabled = false;
          }
        }catch(e){}
      }, 1200);
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);
        renderProgress(botMsgEl, [], [], 'pending');

        if(!isStream){
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        const { session_id } = data;
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer md';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        function handleFinal(e){
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0)
              ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        }
        es.addEventListener('final', handleFinal);
        es.addEventListener('final_answer', handleFinal);

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += '\n\n（错误：SSE 连接中断/失败）';
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `<div class="md"><p>请求失败：${escapeHtml(e.message || e)}</p></div>` + (progress ? progress.outerHTML : '');
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); onSend(); }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method:'DELETE' });
        if(!res.ok) alert('服务端清空失败，仅清空本地显示');
      }catch(e){ alert('服务端清空失败，仅清空本地显示'); }
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
