[project]
name = "finance-brain"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "modelscope>=1.35.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "regex>=2026.2.28",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchvision==0.27.0",
    "uvicorn>=0.42.0",
    "transformers==4.57.6",
    "datasets>=4.8.4",
    "openai-agents==0.4.2",
    "requests>=2.32.5",
    "python-docx>=1.1.2",
    "pywin32>=306; sys_platform == 'win32'"
]

# 全局镜像源配置
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
#url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# 过滤Linux专属依赖
[tool.uv]
required-environments = "sys_platform == 'win32' and platform_machine == 'AMD64'"
